name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify release tag and local/main provenance
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag $GITHUB_REF_NAME is not plain vX.Y.Z"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "$pkg" ]]; then
            echo "::error::tag $GITHUB_REF_NAME ($tag) does not match package.json version $pkg"
            exit 1
          fi
          git fetch origin local/main:refs/remotes/origin/local/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/local/main; then
            echo "::error::release tag $GITHUB_REF_NAME is not reachable from local/main"
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Use the npm bundled with Node 24 (>= 11.5.1, so OIDC trusted publishing
      # is supported). Do NOT `npm install -g npm@latest`: npm 12.0.0 ships a
      # broken tree that fails `--provenance` ("Cannot find module 'sigstore'").
      - name: Show npm version
        run: npm --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun test src/
      - name: Verify release helper
        run: bash scripts/test-release-helper.sh
      - name: Verify smoke helper
        run: bash scripts/test-smoke-antigravity.sh
      - name: Publish to npm
        run: npm publish --provenance --access public

  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish CHANGELOG section as release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## / {
              if (started) exit
              h=$0; sub(/^##[ \t]+/, "", h); sub(/^v/, "", h); sub(/^\[/, "", h)
              if (h ~ ("^" ver "([^0-9.]|$)")) started=1
            }
            started
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no CHANGELOG section found for $GITHUB_REF_NAME"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
