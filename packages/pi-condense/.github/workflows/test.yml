name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [local/main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun test src/
      - name: Verify release helper
        run: bash scripts/test-release-helper.sh
      - name: Verify smoke helper
        run: bash scripts/test-smoke-antigravity.sh
